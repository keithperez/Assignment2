<!DOCTYPE html>
<html lang="en">
    <head></head>

    <body>

        <canvas id="myCanvas" width="640" height="480" style="border: 1px solid #000;">
            Your browser does not support the canvas element.
        </canvas>
        <script type="text/javascript" src="/StickFigure.js"></script>
        <script type="text/javascript">
            window.onload = function() {

                var canvas = document.getElementById("myCanvas");
                var context = canvas.getContext("2d");

                // var leftArmSlider = document.getElementById("slider");
                // leftArmSlider.value = 0;
                // var leftArmTheta = leftArmSlider.value*Math.PI;

                var ball_chain = new StickFigure(context, canvas.width/2, canvas.height/2, 50, 0.05);

                requestAnimationFrame(mainLoop);

                function mainLoop() {
                    processInput();
                    update();
                    draw();

                    requestAnimationFrame(mainLoop);

                }

                function processInput() {}
                function update() {

                    ball_chain.update()

                }
                function draw() {
                    context.clearRect(0, 0, canvas.width, canvas.height);

                    ball_chain.draw();

                }

            }
        </script>

    </body>

</html>
